[project]
name = "sms-gate"
version = "0.1.0"
description = "Async SMS Gateway MVP"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aio-pika>=9.5.8,<10.0.0",
    "alembic>=1.17.2,<2.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "fastapi>=0.136.1,<0.137.0",
    "greenlet>=3.3.0,<4.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "sqlalchemy>=2.0.44,<3.0.0",
    "uvicorn>=0.46.0,<0.47.0"
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21.0,<1.0.0",
    "pytest>=9.0.1,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.14.6,<1.0.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0,<1.0.0",
    "pytest>=9.0.1,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.14.6,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]